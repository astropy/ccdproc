[tox]
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
isolated_build = true


[testenv]
setenv =
    jax: CCDPROC_ARRAY_LIBRARY = jax
    jax: JAX_ENABLE_X64 = True
    dask: CCDPROC_ARRAY_LIBRARY = dask
    strict: CCDPROC_ARRAY_LIBRARY = array-api-strict
    strict: CCDPROC_TRIAGE_ESCAPES = 1
    # Local-only factor for turning on escape logging with other backends,
    # e.g. py312-test-dask-escapes. Not used in CI. Enables both the
    # np.asarray escape logger (catches silent conversions even in passing
    # tests) and the failure-triage summary.
    escapes: CCDPROC_LOG_ARRAY_ESCAPES = 1
    escapes: CCDPROC_TRIAGE_ESCAPES = 1
    # Live logging so escapes logged during *passing* tests are shown;
    # pytest only prints captured logs for failing tests otherwise.
    escapes: PYTEST_ADDOPTS = -o log_cli=true
    # CI gate: compare the live-logged library escapes against the checked-in
    # baseline (ccdproc/tests/array_escape_baseline.txt) and fail the run if a
    # *new* escape appears. Enforcement needs the escape logger, so this
    # factor deliberately sets both variables (pytest_configure in
    # ccdproc/tests/_array_api_plugin rejects enforce mode without the
    # logger); compose with a backend factor, e.g.
    # py312-alldeps-dask-enforce. Add new entries to the baseline locally (in
    # the source tree, not under tox) with CCDPROC_WRITE_ESCAPE_BASELINE=1.
    enforce: CCDPROC_LOG_ARRAY_ESCAPES = 1
    enforce: CCDPROC_ENFORCE_ESCAPE_BASELINE = 1
    devdeps: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/astropy/simple

extras = test

# Run the tests in a temporary directory to make sure that we don't
# import this package from the source tree
#
# The CI strict/enforce envs (py313-strict, py312-alldeps-dask-enforce)
# deliberately omit the "test" factor so they run from the source tree
# instead of .tmp/{envname}. Do not rename them to py31x-test-...: that
# silently changes which copy of ccdproc is imported. The escape baseline
# itself is safe either way -- the array-API escape plugin resolves both the
# package root (by importing ccdproc) and the baseline path (relative to the
# directory of the ini file pytest picks, i.e. this directory) rather than
# from its own __file__.
changedir =
    test: .tmp/{envname}

description =
    run tests
    alldeps: with all optional dependencies
    devdeps: with the latest developer version of key dependencies
    oldestdeps: with the oldest supported version of key dependencies
    cov: and test coverage
    numpy220: with numpy 2.2.*, the oldest supported numpy
    bottleneck: with bottleneck
    jax: with JAX as the array library
    strict: with array-api-strict as the array library
    escapes: with escape-triage logging enabled (local use only)
    enforce: failing the run if a new array-API escape appears (baseline ratchet)


# tox installs deps first and the package with its extras second, in a
# separate pip call. Without a constraint that second call upgrades any pinned
# package some other dependency's newest release needs a newer version of:
# jax 0.11 requires numpy>=2.1, which turned the old numpy200 env into a
# numpy 2.5 run. For the envs whose whole point is the pinned versions, hold
# the package install to the pins in deps.
constrain_package_deps =
    numpy220,oldestdeps: true
    !numpy220-!oldestdeps: false

# The following provides some specific pinnings for key packages
deps =
    cov: coverage

    # currently oldest supported numpy version
    numpy220: numpy==2.2.*

    bottleneck: bottleneck>=1.3.2

    devdeps: astropy>=0.0.dev0
    devdeps: git+https://github.com/astropy/astroscrappy.git#egg=astroscrappy

    # Keep these in step with the minimum versions in pyproject.toml.
    oldestdeps: numpy==2.2.*
    oldestdeps: astropy==7.0.*
    oldestdeps: scipy==1.15.*
    oldestdeps: reproject==0.14.0
    oldestdeps: astroscrappy==1.2.0

    dask: dask
    # The strict env intentionally installs only the test extras plus
    # array-api-strict (no alldeps): numpy-boundary paths through
    # scipy/reproject/astroscrappy are out of scope there, so do not "fix"
    # this by adding optional dependencies.
    strict: array-api-strict>=2.0

commands =
    pip freeze
    !cov-!oldestdeps: pytest --pyargs ccdproc {toxinidir}/docs {posargs}
    cov: pytest --pyargs ccdproc {toxinidir}/docs --cov ccdproc --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml
    # Do not care about warnings on the oldest builds
    oldestdeps: pytest --pyargs ccdproc {toxinidir}/docs -W ignore {posargs}

[testenv:strict]
# Local convenience env for reproducing the CI ``py313-strict`` job:
#
#     tox -e strict -- -k combiner
#
# The env name carries the "strict" factor, so setenv (CCDPROC_ARRAY_LIBRARY,
# CCDPROC_TRIAGE_ESCAPES), deps (array-api-strict) and commands are all
# inherited from [testenv] and stay in lockstep with CI by construction --
# only the interpreter is pinned here. That pin is the whole point: tox is
# often installed under an interpreter too old for ccdproc, and without a
# "py3xx" factor in the name tox would otherwise build this env against
# whichever interpreter is running tox itself.
#
# No "test" factor in the name on purpose -- see the changedir comment in [testenv].
basepython = python3.13

[testenv:build_docs]
extras = docs
changedir = docs
commands =
  pip freeze
  sphinx-build . _build/html -b html -W {posargs}

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style with ruff
deps = ruff
commands = ruff check ccdproc
